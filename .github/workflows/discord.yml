name: Discord Notification

on:
  push:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send commit info to Discord
        run: |
          COMMIT_MESSAGE=$(echo "${{ github.event.head_commit.message }}" | sed 's/"/\\"/g')
          AUTHOR="${{ github.actor }}"
          REPO="${{ github.repository }}"
          URL="${{ github.event.head_commit.url }}"
          BRANCH="${GITHUB_REF#refs/heads/}"
          COMMIT_ID="${GITHUB_SHA::7}"

          PAYLOAD=$(jq -n \
            --arg title "🚀 New Commit — $REPO" \
            --arg desc "$COMMIT_MESSAGE" \
            --arg url "$URL" \
            --arg author "$AUTHOR" \
            --arg branch "$BRANCH" \
            --arg commit "$COMMIT_ID" \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                url: $url,
                color: 5814783,

                fields: [
                  {
                    name: "👤 Author",
                    value: "[\($author)](https://github.com/\($author))",
                    inline: true
                  },
                  {
                    name: "🌿 Branch",
                    value: $branch,
                    inline: true
                  },
                  {
                    name: "🔖 Commit",
                    value: $commit,
                    inline: true
                  }
                ],

                footer: {
                  text: "JR. Website・GitHub Actions"
                },

                timestamp: now | todate
              }]
            }')

          curl -H "Content-Type: application/json" \
               -d "$PAYLOAD" \
               ${{ secrets.DISCORD_WEBHOOK }}
