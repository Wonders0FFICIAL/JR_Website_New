<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 ・ Page Not Found</title>
    <link rel="icon" href="/assets/images/Favicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=PT+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --surface: #090C15;
            --purple: #5638E5;
            --purple-glow: rgba(86, 56, 229, 0.4);
            --text-primary: #F0F0FF;
            --text-secondary: #8B8FAD;
            --text-muted: #3E4268;
        }

        body {
            background: var(--surface);
            color: var(--text-primary);
            font-family: 'Comfortaa', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #c {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(80px);
            z-index: 0;
        }
        .orb-a {
            width: 520px; height: 520px;
            top: -140px; left: -120px;
            background: radial-gradient(circle, rgba(86,56,229,0.18) 0%, transparent 70%);
            animation: drift-a 18s ease-in-out infinite alternate;
        }
        .orb-b {
            width: 400px; height: 400px;
            bottom: -100px; right: -80px;
            background: radial-gradient(circle, rgba(86,56,229,0.13) 0%, transparent 70%);
            animation: drift-b 22s ease-in-out infinite alternate;
        }

        @keyframes drift-a { to { transform: translate(60px, 80px); } }
        @keyframes drift-b { to { transform: translate(-50px, -60px); } }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 48px 32px;
            max-width: 560px;
            width: 100%;
        }

        .error-code {
            font-family: 'PT Sans', sans-serif;
            font-size: clamp(80px, 14vw, 148px);
            font-weight: 700;
            line-height: 1;
            background: linear-gradient(135deg, #a891ff 0%, #5638E5 45%, #3b8cff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
            animation: pulse-code 4s ease-in-out infinite;
            margin-bottom: 12px;
        }

        @keyframes pulse-code {
            0%, 100% { filter: drop-shadow(0 0 24px rgba(86,56,229,0.5)); }
            50%       { filter: drop-shadow(0 0 48px rgba(86,56,229,0.85)); }
        }

        .divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--purple), transparent);
            margin: 0 auto 28px;
            border-radius: 2px;
            animation: divider-glow 3s ease-in-out infinite;
        }

        @keyframes divider-glow {
            0%, 100% { opacity: 0.5; width: 60px; }
            50%       { opacity: 1;   width: 100px; }
        }

        .headline {
            font-size: clamp(18px, 3.5vw, 26px);
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 14px;
            letter-spacing: -0.01em;
        }

        .subtext {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 44px;
            max-width: 380px;
            margin-left: auto;
            margin-right: auto;
        }

        .buttons {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            padding: 13px 28px;
            border-radius: 10px;
            font-family: 'Comfortaa', sans-serif;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.22s ease;
            letter-spacing: 0.01em;
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.08) 50%, transparent 100%);
            transform: translateX(-100%);
            transition: transform 0.4s ease;
        }
        .btn:hover::after { transform: translateX(100%); }

        .btn-primary {
            background: var(--purple);
            color: white;
            border: 1px solid transparent;
            box-shadow: 0 4px 20px var(--purple-glow);
        }
        .btn-primary:hover {
            background: #4325C2;
            box-shadow: 0 6px 32px rgba(86,56,229,0.65);
        }
        .btn-primary:active { transform: translateY(0); }

        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid rgba(86,56,229,0.35);
        }
        .btn-ghost:hover {
            color: var(--text-primary);
            border-color: var(--purple);
            background: rgba(86,56,229,0.1);
        }
        .btn-ghost:active { transform: translateY(0); }

        .footer-note {
            margin-top: 52px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .footer-note a {
            color: #5538e5;
            text-decoration: none;
            transition: color 0.2s;
        }
        .footer-note a:hover { color: var(--purple); }

        @media (max-width: 480px) {
            .buttons { flex-direction: column; align-items: stretch; max-width: 220px; margin: 0 auto; }
            .btn { justify-content: center; }
        }
    </style>
</head>
<body>

    <canvas id="c"></canvas>
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>

    <div class="container">
        <div class="error-code">404</div>

        <div class="divider"></div>

        <h1 class="headline">This page doesn't exist</h1>
        <p class="subtext">The page you're looking for may have been moved, deleted, or perhaps never existed at all.</p>

        <div class="buttons">
            <a href="/" class="btn btn-primary">Take me home</a>
            <a href="javascript:history.back()" class="btn btn-ghost">Go back</a>
        </div>

        <p class="footer-note">
            Something broken? <a href="/contact">Let us know</a>
        </p>
    </div>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        let W, H, stars = [];
        const COUNT = 80, DIST = 130;
        const r = 86, g = 56, b = 229;

        function resize() {
            W = canvas.width  = window.innerWidth;
            H = canvas.height = window.innerHeight;
            stars = Array.from({ length: COUNT }, () => ({
                x: Math.random() * W, y: Math.random() * H,
                vx: (Math.random() - 0.5) * 0.15,
                vy: (Math.random() - 0.5) * 0.15,
                rad: Math.random() * 1.5 + 0.4,
                a: Math.random() * 0.5 + 0.2,
            }));
        }

        window.addEventListener('resize', resize);
        resize();

        function draw() {
            ctx.clearRect(0, 0, W, H);
            for (const s of stars) {
                s.x += s.vx; s.y += s.vy;
                if (s.x < 0) s.x = W; if (s.x > W) s.x = 0;
                if (s.y < 0) s.y = H; if (s.y > H) s.y = 0;
            }
            for (let i = 0; i < stars.length; i++) {
                for (let j = i + 1; j < stars.length; j++) {
                    const dx = stars[i].x - stars[j].x, dy = stars[i].y - stars[j].y;
                    const d = Math.sqrt(dx*dx + dy*dy);
                    if (d < DIST) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(${r},${g},${b},${(1 - d/DIST) * 0.15})`;
                        ctx.lineWidth = 0.6;
                        ctx.moveTo(stars[i].x, stars[i].y);
                        ctx.lineTo(stars[j].x, stars[j].y);
                        ctx.stroke();
                    }
                }
            }
            for (const s of stars) {
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.rad, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${r},${g},${b},${s.a * 0.45})`;
                ctx.fill();
            }
            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
